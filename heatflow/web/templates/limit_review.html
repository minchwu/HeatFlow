<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/favicon.ico?v={{ version }}"><title>HEATFLOW · 涨停复盘</title>
<style>
:root{--bg:#070d18;--panel:#0f1a2b;--line:#29445f;--text:#e8f1ff;--muted:#8195af;--cyan:#42c6ff;--up:#ff3b30;--broken:#b45250}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:Inter,"Microsoft Yahei",Arial,sans-serif;background:radial-gradient(circle at 12% -10%,#173653 0,transparent 34%),linear-gradient(180deg,#081221,#050912);min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(27,48,72,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(27,48,72,.45) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(#000,transparent 84%)}main{position:relative;max-width:1480px;margin:auto;padding:22px}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #365672;padding:1px 0 17px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid #4f7897;box-shadow:0 0 0 4px rgba(66,198,255,.12),0 0 20px rgba(66,198,255,.12)}h1{margin:0;letter-spacing:5px;font-size:30px;text-shadow:0 0 16px rgba(66,198,255,.2)}.sub{margin-top:4px;color:var(--muted);font:11px Consolas;letter-spacing:1px}.nav a{margin-left:20px;color:#a9bfd8;text-decoration:none;font-size:13px}.nav .active{color:var(--cyan)}.toolbar,.panel{border:1px solid var(--line);border-radius:7px;background:linear-gradient(145deg,rgba(15,28,47,.98),rgba(8,16,29,.98));box-shadow:0 14px 35px rgba(0,0,0,.24),inset 0 1px rgba(152,213,255,.04)}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0 10px;padding:12px 14px}.toolbar label,.toolbar span{color:var(--muted);font:12px Consolas}select,button{color:var(--text);background:#0c1a2d;border:1px solid #385875;border-radius:4px;padding:8px 10px;font:13px "Microsoft Yahei"}button{cursor:pointer;background:#112c47}button:hover{border-color:#57cfff;color:#fff}.mode{margin-left:auto;color:var(--cyan)!important}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:10px 0}.metric{padding:13px 15px;border-top:2px solid var(--metric)}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:6px;font:700 21px Consolas}.review-head{display:flex;justify-content:space-between;align-items:end;padding:18px 20px 12px;border-bottom:1px solid var(--line)}.review-head h2{margin:0;font-size:20px;letter-spacing:1px}.review-head span{color:var(--muted);font:11px Consolas}.concepts{padding:12px 20px 22px}.concept{margin:12px 0;border:1px solid #294761;border-left:3px solid var(--concept);background:rgba(7,18,32,.58)}.concept-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(48,77,105,.7);background:linear-gradient(90deg,color-mix(in srgb,var(--concept),transparent 88%),transparent)}.concept-title{display:flex;gap:9px;align-items:baseline}.concept-title h3{margin:0;color:var(--concept);font-size:17px}.concept-title small{color:var(--muted);font:11px Consolas}.concept-head p{max-width:62%;margin:0;color:#afc4db;font-size:12px;line-height:1.5;text-align:right}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px}.card{min-width:0;padding:11px;border:2px solid var(--concept);border-radius:5px;background:linear-gradient(145deg,color-mix(in srgb,var(--concept),#101e32 87%),#0d1a2b 78%)}.card.broken{border-style:dashed;border-color:var(--broken);background:linear-gradient(145deg,rgba(180,82,80,.14),#0d1a2b 78%)}.card-top{display:flex;justify-content:space-between;gap:7px;align-items:flex-start}.name{min-width:0;color:var(--stock);font-size:14px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;word-break:break-all}.name small{color:var(--muted);font:10px Consolas}.state{flex:0 0 auto;padding:2px 5px;border-radius:3px;font-size:10px;font-weight:700;color:var(--up);background:rgba(255,59,48,.13)}.broken .state{color:#c96662;background:rgba(180,82,80,.15)}.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.pill{padding:3px 5px;border:1px solid var(--pill);border-radius:3px;color:var(--pill);font:700 10px Consolas}.reason{margin:8px 0 0;color:#b8cbe0;font-size:11px;line-height:1.5;overflow-wrap:anywhere}.empty{padding:28px;color:var(--muted)}footer{padding:18px 0;color:#6f87a2;font-size:11px}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.concept-head{align-items:flex-start;flex-direction:column}.concept-head p{max-width:none;text-align:left}}@media(max-width:700px){main{padding:11px}.nav{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.cards{grid-template-columns:1fr}}
</style><style>
.header{height:66px}.brand{min-height:48px}.brand img{width:48px;height:48px}.brand h1{font-size:30px;line-height:1;letter-spacing:5px}.sub{margin-top:4px;font:11px/1.2 Consolas;letter-spacing:1px}
.card.broken{border-color:var(--concept);background:linear-gradient(145deg,color-mix(in srgb,var(--concept),#101e32 93%),#0b1422 82%);filter:saturate(.72) brightness(.82)}
.height-row{border-top:1px solid rgba(66,198,255,.16);padding:8px 0 2px}.height-row:first-child{border-top:0}.height-label{padding:0 10px 5px;color:var(--concept);font:700 11px Consolas;letter-spacing:.4px}.height-row .cards{padding:4px 10px 10px}
.evidence{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:7px;color:#8fa7c0;font:10px/1.35 Consolas}.confidence{padding:2px 5px;border:1px solid var(--concept);border-radius:3px;color:var(--concept)}
</style><style id="mobile-layout-v16">.mobile-nav{display:none}@media(max-width:700px){html,body{max-width:100%;overflow-x:hidden}main{width:100%;padding:10px}.header{height:auto;min-height:66px;align-items:flex-start;gap:10px}.nav{display:none}.mobile-nav{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.mobile-nav::-webkit-scrollbar{display:none}.mobile-nav a{flex:0 0 auto;min-height:38px;padding:9px 12px;border:1px solid #35516c;border-radius:5px;color:#b9cde3;text-decoration:none;font-size:12px;white-space:nowrap}.mobile-nav a.active{color:#eaf7ff;border-color:#42c6ff;background:rgba(66,198,255,.12)}.toolbar{padding:10px;gap:7px}.toolbar select,.toolbar button{min-height:38px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.metric{padding:10px 11px}.review-head{align-items:flex-start;gap:5px;flex-direction:column;padding:14px 13px 10px}.concepts{padding:8px 10px 15px}.concept-head{padding:10px}.concept-title{align-items:flex-start;flex-direction:column;gap:3px}.concept-head p{font-size:11px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:7px}.card{padding:9px}.name{font-size:13px}.reason{font-size:10px}.evidence{font-size:9px}}@media(max-width:460px){.cards{grid-template-columns:1fr}}</style></head><body><main>
<header class="header"><div class="brand"><img src="/static/youtianxia-logo.png?v={{ version }}" alt="邻小路 Logo"><div><h1>HEATFLOW</h1><div class="sub">涨停复盘 · 多源催化证据与封板节奏</div></div></div><nav class="nav"><a href="/">实时看板</a><a href="/tower">涨停分布</a><a class="active" href="/limit-review">涨停复盘</a><a href="/history">历史复盘</a></nav></header>
<nav class="mobile-nav" aria-label="移动端页面导航"><a href="/">实时看板</a><a href="/tower">涨停分布</a><a class="active" href="/limit-review">涨停复盘</a><a href="/history">历史复盘</a></nav>
<section class="toolbar"><label>行情日期</label><select id="date">{% for day in dates %}<option value="{{ day }}"{% if day==today %} selected{% endif %}>{{ day }}</option>{% endfor %}</select><button id="load">载入复盘</button><span id="updated">{{ review.generated_at or '历史事件数据' }}</span><span class="mode">实时交易日 10S · 休市 30S</span></section>
<section class="metrics"><div class="panel metric" style="--metric:#f2ad4b"><span>最高连板</span><b id="highest">—</b></div><div class="panel metric" style="--metric:#ff3b30"><span>封板家数</span><b id="sealed">—</b></div><div class="panel metric" style="--metric:#b45250"><span>炸板家数</span><b id="broken">—</b></div><div class="panel metric" style="--metric:#b18cff"><span>首板家数</span><b id="first">—</b></div><div class="panel metric" style="--metric:#42c6ff"><span>连板家数</span><b id="continuation">—</b></div></section>
<section class="panel"><div class="review-head"><h2>涨停原因 · 炒作概念归类</h2><span id="review-date">{{ review.date }}</span></div><div id="concepts" class="concepts"></div></section><footer>HEATFLOW · 邻小路 · 涨停原因来自公开行情字段与板块逻辑归纳，需结合公告与盘面确认，不构成投资建议。</footer>
</main>
<script>
const initial={{ review|tojson }},date=document.getElementById('date');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=v=>{let h=2166136261;for(const c of String(v)){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0};
const color=v=>`hsl(${hash('concept:'+v)%360} 62% 55%)`,stockColor=v=>`hsl(${hash('stock:'+v)%360} 72% 58%)`;
const sourceLabel={eastmoney_limit_pool:'东财行情',heatflow_taxonomy:'规则归类',ths:'同花顺',taoguba:'淘股吧',cls:'财联社',sina:'新浪财经',wallstreetcn:'华尔街见闻'};
function render(data){
  const s=data.summary||{};
  document.getElementById('highest').textContent=`${s.highest_height||0} 板`;
  document.getElementById('sealed').textContent=s.sealed??0;document.getElementById('broken').textContent=s.broken??0;
  document.getElementById('first').textContent=s.first_board??0;document.getElementById('continuation').textContent=s.continuation??0;
  document.getElementById('review-date').textContent=data.date||'';const evidence=data.reason_evidence||{},external=(evidence.external_sources||[]).map(s=>sourceLabel[s]||s).join(' · ');document.getElementById('updated').textContent=`${data.generated_at||'历史事件数据'} · ${evidence.mode||'行情池 + 规则归类'}${external?` · ${external}`:''}`;
  const host=document.getElementById('concepts');
  host.innerHTML=(data.concepts||[]).map(group=>{
    const cc=color(group.concept), byHeight={};
    (group.items||[]).forEach(item=>(byHeight[item.height]??=[]).push(item));
    const rows=Object.keys(byHeight).map(Number).sort((a,b)=>b-a).map(height=>{
      const cards=byHeight[height].map(item=>{const sc=stockColor(item.code),sources=(item.evidence_sources||[]).map(s=>sourceLabel[s]||s).join(' · ');return `<article class="card ${item.broken?'broken':''}" style="--concept:${cc};--stock:${sc}"><div class="card-top"><span class="name">${esc(item.name)} <small>${esc(item.code)}</small></span><span class="state">${item.state}</span></div><div class="meta"><span class="pill" style="--pill:${cc}">${item.height}板</span><span class="pill" style="--pill:${item.broken?'#c96662':'#ff6b63'}">首次 ${esc(item.first_limit_time)}</span><span class="pill" style="--pill:${item.broken?'#c96662':'#ff3b30'}">${item.broken?'炸板':'封板'} ${esc(item.last_limit_time)}</span></div><p class="reason">${esc(item.reason)}</p><div class="evidence"><span class="confidence">${esc(item.confidence_label||'板块推断')} ${Number(item.confidence||0).toFixed(2)}</span><span>${esc(sources||'规则归类')}</span></div></article>`}).join('');
      return `<div class="height-row"><div class="height-label">${height}板 · ${byHeight[height].length}只</div><div class="cards">${cards}</div></div>`;
    }).join('');
    return `<section class="concept" style="--concept:${cc}"><div class="concept-head"><div class="concept-title"><h3>${esc(group.concept)}</h3><small>${group.count}只 · 最高${group.highest_height}板 · 首次${esc(group.first_time)}</small></div><p>${esc(group.reason)}</p></div>${rows}</section>`;
  }).join('')||'<div class="empty">该交易日暂无可用涨停事件</div>';
}
render(initial);
async function load(){try{const data=await fetch('/api/limit-review/'+encodeURIComponent(date.value),{cache:'no-store'}).then(r=>r.json());render(data)}catch(_){}}
document.getElementById('load').addEventListener('click',()=>{date.dataset.manual='1';load()});
const isLive=()=>{const n=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'})),m=n.getHours()*60+n.getMinutes();return n.getDay()>0&&n.getDay()<6&&((m>=570&&m<=690)||(m>=780&&m<=900))};
if(!window.HEATFLOW_STATIC)setInterval(()=>{if(!date.dataset.manual)load()},isLive()?10000:30000);
</script></body></html>
