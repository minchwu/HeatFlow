ary{background:#14668e;border-color:#268fc1}.divider{width:1px;height:26px;background:#385875;margin:0 2px}.replay-controls{display:flex;align-items:center;gap:6px;flex:1 1 540px;min-width:440px}.replay-controls b{font:700 16px Consolas;color:#f2f7ff;white-space:nowrap}.replay-controls .frame-note{white-space:nowrap}.scrub{flex:1;min-width:155px;accent-color:#42c6ff}.mode{margin-left:auto;color:var(--cyan)!important;white-space:nowrap}.metrics{display:grid;grid-template-columns:5fr 1fr;gap:10px;margin-bottom:10px}.metrics-primary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.metric{padding:12px 14px;min-height:72px;border-top:2px solid var(--metric);background:linear-gradient(145deg,#102038,#0a1728)}.metric span{font-size:11px;color:var(--muted)}.metric b{display:block;margin-top:6px;color:#eef7ff;font:700 20px Consolas;white-space:nowrap}.top-split{display:grid;grid-template-columns:5fr 1fr;gap:10px;align-items:stretch}.tower-panel,.events,.review{padding:17px}.tower-head{display:flex;justify-content:space-between;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line)}.tower-head h2{margin:0;font-size:20px;letter-spacing:1px}.tower-head span{font:11px Consolas;color:var(--muted)}.distribution{display:flex;flex-direction:column;gap:10px;padding-top:12px}.board-level{border:1px solid #294761;border-left:3px solid #47708f;background:rgba(7,18,32,.54)}.level-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;border-bottom:1px solid rgba(48,77,105,.7);background:linear-gradient(90deg,rgba(41,88,122,.16),transparent)}.level-head b{font-size:14px;color:#dceeff}.level-head span{font:10px Consolas;color:#8fa5bf}.brick-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:8px}.brick{min-width:0;min-height:52px;padding:4px 6px;border:1px solid var(--sector);border-radius:4px;background:linear-gradient(135deg,color-mix(in srgb,var(--sector),#0e1b2c 80%),#101e32 72%);box-shadow:inset 0 0 12px color-mix(in srgb,var(--sector),transparent 84%)}.brick.new{animation:enter .55s ease both;box-shadow:0 0 15px color-mix(in srgb,var(--sector),transparent 62%),inset 0 0 12px color-mix(in srgb,var(--sector),transparent 84%)}.brick.previous{opacity:.51;filter:grayscale(.56);border-style:dashed;background:#1a2430}.brick-top{display:flex;justify-content:space-between;gap:4px;align-items:flex-start}.brick-name{overflow-wrap:anywhere;word-break:break-all;color:var(--stock);font-size:12px;font-weight:700;line-height:1.28}.brick-code{flex:0 0 auto;color:#aabbd0;font:10px Consolas}.brick-meta{display:block;overflow-wrap:anywhere;word-break:break-all;margin-top:3px;color:var(--sector);font-size:10px;line-height:1.28}.broken-bay{padding:7px 8px 8px;border-top:1px dashed #80484a;background:linear-gradient(90deg,rgba(180,82,80,.11),transparent)}.broken-bay:before{content:"炸板区";display:block;margin:0 0 4px;color:#bd6865;font:10px Consolas}.broken-bay .brick{opacity:.62;filter:saturate(.7);border-style:dashed}.events{display:flex;flex-direction:column;min-width:0;min-height:0}.events h3,.review h3{margin:0 0 10px;font-size:15px}.event-log{flex:1;min-height:0;overflow:auto}.event{padding:8px 0;border-bottom:1px solid rgba(55,85,111,.52);font-size:12px}.event time{display:block;font:10px Consolas;color:#8da6c1;margin-bottom:3px}.event b{display:block;overflow-wrap:anywhere;font-weight:700;color:#d9e7f4}.event small{display:block;overflow-wrap:anywhere;margin-top:3px;color:#92a8c1;font-size:10px}.event.NEW_LIMIT b{color:#ff6b63}.event.UPGRADE b{color:#f2ad4b}.event.BREAK_FIRST b,.event.BREAK_CONTINUE b{color:#c96662}.review{margin-top:10px}.review-lead{padding:10px 12px;border-left:3px solid var(--review);background:color-mix(in srgb,var(--review),transparent 90%);font-size:14px;line-height:1.6}.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.review-card{padding:10px;border:1px solid #294761;background:rgba(12,27,45,.7)}.review-card label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.review-card p{margin:0;color:#c4d4e7;font-size:12px;line-height:1.65}.signal-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.signal{padding:5px 7px;border:1px solid #35526e;border-radius:3px;color:#afc4db;font-size:11px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{padding:24px;color:var(--muted)}@keyframes enter{0%{transform:translateY(24px) scale(.92);opacity:0}65%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none}}@media(max-width:1150px){.metrics{grid-template-columns:1fr}.top-split{grid-template-columns:1fr}.event-log{max-height:250px}.review-grid{grid-template-columns:1fr}}@media(max-width:700px){main{padding:11px}.nav{display:none}.metrics-primary{grid-template-columns:repeat(2,minmax(0,1fr))}.replay-controls{min-width:100%;flex-wrap:wrap}.scrub{order:2;flex-basis:100%}.mode{margin-left:0}.brick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.review-grid{grid-template-columns:1fr}}

<main>
  <header class="header"><div class="brand"><img src="../assets/youtianxia-logo.png" alt="邻小路 Logo"><div><h1>HEATFLOW</h1><div class="sub">涨停分布回放</div></div></div><nav class="nav"><a href="../">实时看板</a><a class="active" href="../tower/">涨停分布</a><a href="../limit-review/">涨停复盘</a><a href="../history/">历史复盘</a></nav></header>

  <section class="top-split"><section class="panel tower-panel"><div class="tower-head"><h2>涨停分布</h2><span id="tower-time">09:25 / 初始</span></div><div id="distribution" class="distribution"><div class="empty">加载涨停结构…</div></div></section><aside class="panel events"><h3>涨停事件</h3><div class="event-log" id="event-log"><div class="empty">暂无可回放事件</div></div></aside></section>

</main>
<script>
let tower={frames:[]},frameIndex=0,playing=false,timer=null,speed=1,newsItems=[];
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=v=>{let h=2166136261;for(const c of String(v)){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0};
const stockColor=code=>`hsl(${hash('stock:'+code)%360} 72% 58%)`,sectorColor=sector=>`hsl(${hash('board:'+(sector||'市场热点'))%360} 62% 52%)`;
function statusText(b){return b.status==='previous'?`昨日${b.board}板`:b.status==='broken'?'炸板':'涨停'}
function statusTime(b){return b.status==='previous'?`昨日${b.board}板`:`${statusText(b)} ${b.status==='broken'?b.last_limit_time:b.first_limit_time}`}
function brickMarkup(b){return `<article class="brick ${esc(b.status)} ${b.status==='new_limit'?'new':''}" style="--sector:${sectorColor(b.sector)};--stock:${stockColor(b.code)}" title="${esc(b.name)}｜${esc(b.sector)}｜${statusTime(b)}"><div class="brick-top"><span class="brick-name">${esc(b.name)}</span><span class="brick-code">${esc(b.code)}</span></div><span class="brick-meta">${esc(b.sector)} · ${statusTime(b)}</span></article>`}
function byTime(a,b){return String(a.first_limit_time).localeCompare(String(b.first_limit_time),'zh-CN')||String(a.sector).localeCompare(String(b.sector),'zh-CN')||String(a.code).localeCompare(String(b.code),'zh-CN')}
function renderDistribution(bricks){const host=$('distribution'),all=bricks||[],levels=[...new Set(all.map(b=>Number(b.board)||1))].sort((a,b)=>b-a);if(!levels.length){host.innerHTML='<div class="empty">暂无涨停数据</div>';return}host.innerHTML=levels.map(board=>{const pool=all.filter(b=>(Number(b.board)||1)===board),active=pool.filter(b=>b.status!=='broken').sort(byTime),fallen=pool.filter(b=>b.status==='broken').sort(byTime);return `<section class="board-level" data-board="${board}"><header class="level-head"><b>${board}板</b><span>封板 ${active.length} · 炸板 ${fallen.length}</span></header>${active.length?`<div class="brick-grid">${active.map(brickMarkup).join('')}</div>`:'<div class="empty">本高度暂无封板个股</div>'}${fallen.length?`<div class="broken-bay"><div class="brick-grid">${fallen.map(brickMarkup).join('')}</div></div>`:''}</section>`}).join('')}
function renderLog(time){const labels={NEW_LIMIT:'新增涨停',UPGRADE:'连板晋级',BREAK_FIRST:'首板炸板',BREAK_CONTINUE:'连板炸板'},rows=(tower.event_log||[]).filter(e=>e.time<=time).slice(-30).reverse();$('event-log').innerHTML=rows.map(e=>`<article class="event ${e.type}"><time>${esc(e.time)}</time><b>${esc(labels[e.type]||'涨停事件')} · ${esc(e.name)}</b><small>${esc(e.code)}　${esc(e.sector)}　${e.from_board||0}板 → ${e.to_board}板</small></article>`).join('')||'<div class="empty">09:25 后将逐步出现涨停事件</div>'}
function leadingSectors(){const active=(tower.frames?.at(-1)?.up_bricks||[]).filter(b=>b.status!=='broken'&&b.status!=='previous'),groups={};active.forEach(b=>(groups[b.sector]??=[]).push(b));return Object.entries(groups).sort((a,b)=>b[1].length-a[1].length||Math.max(...b[1].map(x=>x.board))-Math.max(...a[1].map(x=>x.board))||a[0].localeCompare(b[0],'zh-CN')).slice(0,3).map(([sector])=>sector)}
function renderSummary(){const final=tower.final||{},highest=Number(final.highest_board||0),sealed=Number(final.sealed||0),broken=Number(final.broken||0),index=final.market_index||{},change=Number(index.change||0),leaders=leadingSectors(),ratio=sealed?broken/sealed:1;let mood,accent,advice;if(highest>=4&&sealed>=8&&ratio<.22&&change>=0){mood='连板接力情绪偏暖，封板承接与高度空间均在；可围绕最强主线观察分歧后的回流。';accent='#ff4b43';advice='优先等核心板块的换手回封与前排辨识度个股，避免尾盘追逐跟风首板；仓位以强弱切换确认后递进。'}else if(ratio>.38||change<0){mood='盘面分歧偏强，炸板对情绪的压制需要优先评估；连板参与宜以防守和确认优先。';accent='#35c982';advice='降低盲目接力，重点观察高位股承接和炸板修复。若核心高度无法回封，优先等待下一轮主线明确。'}else{mood='连板结构处于分歧与修复的平衡区，机会主要集中于有板块呼应的前排。';accent='#f2ad4b';advice='采用小仓试错、只做有板块扩散和封单质量支持的前排股；板块无跟随时不宜孤立追高。'}$('review-lead').textContent=mood;$('review-lead').style.setProperty('--review',accent);$('review-structure').textContent=`收盘最高 ${highest||'—'} 板，封板 ${sealed} 家、炸板 ${broken} 家；${leaders.length?`活跃方向集中于 ${leaders.join('、')}。`:'暂无形成明确的板块聚焦。'} 大盘指数${index.value==null?'暂无分钟数据':`${Number(index.value).toFixed(2)}（${change>=0?'+':''}${change.toFixed(2)}%）`}。`;$('review-advice').textContent=advice;const sources=[...new Set(newsItems.map(item=>item.source).filter(Boolean))];$('review-opinion').textContent=sources.length?`已汇集 ${sources.join('、')} 等平台的近期财经资讯，作为盘后主线与风险线索的交叉验证。`:'资讯采集结果暂不可用，本结论以涨停、炸板和连板结构为主。';$('news-signals').innerHTML=newsItems.slice(0,5).map(item=>`<span class="signal" title="${esc(item.title)}">${esc(item.source||'资讯')} · ${esc(item.title)}</span>`).join('')}
function render(){const f=tower.frames?.[frameIndex];if(!f){$('distribution').innerHTML='<div class="empty">该日期暂无涨停数据</div>';return}$('scrub').max=Math.max(0,tower.frames.length-1);$('scrub').value=frameIndex;$('clock').textContent=f.time;$('tower-time').textContent=`${tower.date} · ${f.time} / ${frameIndex===0?'初始':'回放'}`;$('frame-note').textContent=`1分钟 / ${frameIndex+1} 共 ${tower.frames.length} 帧`;const ids={highest_board:'highest',sealed:'sealed',broken:'broken',first_board:'first-board',continuation:'continuation'};for(const [key,id] of Object.entries(ids)){$(id).textContent=(f.metrics[key]??'—')+(key==='highest_board'?' 板':'')}const index=f.metrics.market_index||{},node=$('market-index');node.textContent=index.value==null?'—':Number(index.value).toFixed(2);node.style.color=index.change==null?'#eef7ff':Number(index.change)>=0?'#ff3b30':'#35c982';renderDistribution(f.up_bricks);renderLog(f.time);renderSummary()}
function stop(){playing=false;clearTimeout(timer);$('play').textContent='播放'}function step(delta=1){if(!tower.frames?.length)return;frameIndex=(frameIndex+delta+tower.frames.length)%tower.frames.length;render()}function tick(){if(!playing)return;if(frameIndex>=tower.frames.length-1){stop();return}step(1);timer=setTimeout(tick,Math.max(55,500/speed))}function play(){playing=!playing;$('play').textContent=playing?'暂停':'播放';if(playing){if(frameIndex>=tower.frames.length-1)frameIndex=0;tick()}else clearTimeout(timer)}
async function loadTower(dateText){stop();const r=await fetch('../data/tower/'+encodeURIComponent(dateText)+'.json');if(!r.ok)throw new Error('tower request failed');tower=await r.json();frameIndex=0;$('day').value=dateText;$('quick-day').value=dateText;$('source').textContent=`基于 ${tower.source} · ${tower.interval_minutes}分钟帧 · ${tower.frames.length} 个回放节点`;render()}
async function loadNews(){try{const r=await fetch('../data/hot-news.json',{cache:'no-store'});if(r.ok){newsItems=(await r.json()).items||[];renderSummary()}}catch(_){renderSummary()}}
$('play').onclick=play;$('prev').onclick=()=>{stop();step(-1)};$('next').onclick=()=>{stop();step(1)};$('scrub').oninput=e=>{stop();frameIndex=Number(e.target.value);render()};$('load').onclick=()=>loadTower($('day').value).catch(()=>alert('载入失败，请确认该日期有涨停数据。'));$('quick-day').onchange=e=>{$('day').value=e.target.value;loadTower(e.target.value).catch(()=>{})};document.querySelectorAll('.speed').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);document.querySelectorAll('.speed').forEach(x=>x.classList.toggle('active',x===b))});loadTower('2026-08-14').then(loadNews).catch(()=>{$('distribution').innerHTML='<div class="empty">静态回放数据加载失败</div>'});

/* 同一板高内：板块封板数量优先，再比较该板块首只涨停的时间。 */
function sortLevel(items, reference){const source=(reference&&reference.length?reference:items)||[],stats={};source.forEach(b=>{const key=b.sector||'市场热点';if(!stats[key])stats[key]={count:0,first:String(b.first_limit_time||'99:99')};stats[key].count++;stats[key].first=stats[key].first<String(b.first_limit_time||'99:99')?stats[key].first:String(b.first_limit_time||'99:99')});const ranks=Object.keys(stats).sort((a,b)=>stats[b].count-stats[a].count||stats[a].first.localeCompare(stats[b].first)||a.localeCompare(b,'zh-CN')).reduce((out,key,index)=>(out[key]=index,out),{});return [...(items||[])].sort((a,b)=>(ranks[a.sector]??999)-(ranks[b.sector]??999)||String(a.first_limit_time).localeCompare(String(b.first_limit_time))||String(a.code).localeCompare(String(b.code)))}
function statusTime(b){if(b.status==='previous')return `昨日${b.board}板`;const opens=Number(b.open_count||0),broken=b.status==='broken',base=`${statusText(b)} ${broken?b.last_limit_time:b.first_limit_time}`;if(broken)return opens?`${base} · 开板${opens}次`:base;return opens?`${base} · 开板${opens}次 · 最终封板 ${b.last_limit_time}`:base}
function renderDistribution(bricks){const host=$('distribution'),all=bricks||[],levels=[...new Set(all.map(b=>Number(b.board)||1))].sort((a,b)=>b-a);if(!levels.length){host.innerHTML='<div class="empty">暂无涨停数据</div>';return}host.innerHTML=levels.map(board=>{const pool=all.filter(b=>(Number(b.board)||1)===board),sealed=pool.filter(b=>b.status!=='broken'),active=sortLevel(sealed,sealed),fallen=sortLevel(pool.filter(b=>b.status==='broken'),sealed);return `<section class="board-level" data-board="${board}"><header class="level-head"><b>${board}板</b><span>封板 ${active.length} · 炸板 ${fallen.length}</span></header>${active.length?`<div class="brick-grid">${active.map(brickMarkup).join('')}</div>`:'<div class="empty">本高度暂无封板个股</div>'}${fallen.length?`<div class="broken-bay"><div class="brick-grid">${fallen.map(brickMarkup).join('')}</div></div>`:''}</section>`}).join('')}
function renderLog(time){const labels={NEW_LIMIT:'新增涨停',UPGRADE:'连板晋级',BREAK_FIRST:'首板炸板',BREAK_CONTINUE:'连板炸板',RESEAL:'回封涨停',REOPENED:'盘中开板后回封'},rows=(tower.event_log||[]).filter(e=>e.time<=time).slice(-30).reverse();$('event-log').innerHTML=rows.map(e=>{const note=Number(e.open_count||0)>0?`　盘中开板 ${e.open_count} 次`:'';return `<article class="event ${e.type}"><time>${esc(e.time)}</time><b>${esc(labels[e.type]||'涨停事件')} · ${esc(e.name)}</b><small>${esc(e.code)}　${esc(e.sector)}　${e.from_board||0}板 → ${e.to_board}板${note}</small></article>`}).join('')||'<div class="empty">09:25 后将逐步出现涨停事件</div>'}
</script>
<script>
let towerFollowLatest=true;const manualLoadTower=loadTower;loadTower=async function(dateText){towerFollowLatest=false;return manualLoadTower(dateText)};$('load').onclick=()=>loadTower($('day').value).catch(()=>alert('载入失败，请确认该日期有涨停数据。'));$('quick-day').onchange=e=>{$('day').value=e.target.value;loadTower(e.target.value).catch(()=>{})};
async function refreshTowerData(){if(playing)return;try{const endpoint=towerFollowLatest?'/api/tower/latest':'/api/tower/'+encodeURIComponent(tower?.date||'');const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)return;const next=await r.json();if(next.generated_at===tower.generated_at)return;const currentTime=tower.frames?.[frameIndex]?.time;tower=next;frameIndex=Math.max(0,Math.min(tower.frames.length-1,tower.frames.findIndex(f=>f.time===currentTime)));if(frameIndex<0)frameIndex=0;render()}catch(_){}}
function towerRefreshLoop(){refreshTowerData().finally(()=>setTimeout(towerRefreshLoop,location.hostname==='127.0.0.1'&&new Date().getHours()>=9&&new Date().getHours()<15?10000:30000))}if(!window.HEATFLOW_STATIC)towerRefreshLoop();
</script>
